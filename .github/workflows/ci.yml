name: Project AI Slim CI

on:
  pull_request:
  push:
    branches:
      - main
      - refactor/project-ai-slim
    tags:
      - "staging-validation-*"

concurrency:
  group: projectai-slim-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  slim-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_DB: projectai_ci
          POSTGRES_USER: projectai_ci
          POSTGRES_PASSWORD: projectai_ci_database_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U projectai_ci -d projectai_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "true"
      NODE_ENV: test
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_BASE_PATH: /tool/projectai
      NEXT_PUBLIC_APP_VERSION: 1.0.0-staging
      NEXT_PUBLIC_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DATABASE_URL: postgresql://projectai_ci:projectai_ci_database_only@127.0.0.1:5432/projectai_ci
      BETTER_AUTH_URL: http://127.0.0.1:3200/tool/projectai/api/auth
      AUTH_TRUSTED_ORIGINS: http://127.0.0.1:3200
      AUTH_PROVIDER: legacy-credential-test
      ALLOW_LEGACY_CREDENTIAL_TEST_AUTH: "true"
      PROJECTAI_SEED_ENVIRONMENT: test
      AI_ASSISTANT_ENABLED: "true"
      AI_PROVIDER: fake
      AI_REGION: cn-beijing
      AI_PROJECT_ASSISTANT_PROFILE_ID: qwen-project-assistant-cn-v2
      RAGFLOW_BASE_URL: http://127.0.0.1:3210

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record the exact revision under test
        shell: bash
        env:
          EXPECTED_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          tested_sha="$(git rev-parse HEAD)"
          test "$tested_sha" = "$EXPECTED_TESTED_SHA"
          echo "PROJECTAI_TESTED_SHA=$tested_sha" >> "$GITHUB_ENV"

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Create ephemeral test-only credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          seed_password="Ci-$(openssl rand -hex 16)-Aa1!"
          auth_secret="$(openssl rand -base64 48)"
          ragflow_api_key="ci-$(openssl rand -hex 24)"
          for value in "$seed_password" "$auth_secret" "$ragflow_api_key"; do
            echo "::add-mask::$value"
          done
          {
            echo "BETTER_AUTH_SECRET=$auth_secret"
            echo "RAGFLOW_API_KEY=$ragflow_api_key"
            for name in ADMIN ORG_ADMIN DEPT_ADMIN MANAGER_A MANAGER_B MEMBER_A VIEWER_A OTHER_DEPT OUTSIDER; do
              normalized_name="$(printf '%s' "$name" | tr '[:upper:]_' '[:lower:]-')"
              echo "SEED_${name}_EMAIL=${normalized_name}@projectai.invalid"
              echo "SEED_${name}_PASSWORD=$seed_password"
            done
          } >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: npm ci

      - name: Apply migrations and seed isolated test data
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Run Slim static and deterministic gates
        run: |
          npm test
          npm run typecheck
          npm run lint
          npm run build
          git diff --check HEAD^ HEAD

      - name: Run Slim integration tests with Fake RAGFlow
        shell: bash
        run: |
          set -Eeuo pipefail
          fake_ragflow_log="$RUNNER_TEMP/projectai-fake-ragflow.log"
          node scripts/fake-ragflow-server.mjs >"$fake_ragflow_log" 2>&1 &
          fake_ragflow_pid=$!
          cleanup() {
            kill "$fake_ragflow_pid" >/dev/null 2>&1 || true
            wait "$fake_ragflow_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ready=0
          for _ in {1..30}; do
            if curl --silent --max-time 1 http://127.0.0.1:3210/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if test "$ready" != 1; then
            sed -n '1,120p' "$fake_ragflow_log" >&2
            exit 1
          fi
          npm run test:integration
